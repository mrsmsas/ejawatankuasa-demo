  <style>
:root{
  --hijau:#0f2c63;--hijau-2:#0a1f4a;--hijau-muda:#eaf0fa;--emas:#f5b800;
  --latar:#f4f7fc;--kad:#ffffff;--teks:#14213d;--teks-2:#58647f;--garis:#d3ddf0;
  --bahaya:#b3261e;--bahaya-muda:#fbe7e5;--amaran:#a96a00;--amaran-muda:#fff1d6;--berjaya:#1b7a3d;--berjaya-muda:#e1f4e7;--info:#1f5fa8;--info-muda:#e4eefa;
  --jejari:10px;--bayang:0 1px 3px rgba(15,44,99,.12);--sisi:248px;--sisi-kecil:64px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:14px;color:var(--teks);background:var(--latar);line-height:1.45}
h1,h2,h3{margin:0 0 .5rem;line-height:1.2}
h1{font-size:1.4rem}h2{font-size:1.1rem}h3{font-size:.95rem}
button,input,select,textarea{font:inherit;color:inherit}
.tersembunyi{display:none!important}
/* Susun atur */
#apl{display:flex;min-height:100vh}
#sisi{width:var(--sisi);background:var(--hijau-2);color:#e6edf9;display:flex;flex-direction:column;transition:width .2s;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
#sisi .jenama{display:flex;align-items:center;gap:.6rem;padding:1rem;font-weight:700;border-bottom:1px solid rgba(255,255,255,.12)}
#sisi .jenama .logo{width:34px;height:34px;border-radius:8px;background:var(--emas);color:#0f2c63;display:grid;place-items:center;font-weight:800;flex-shrink:0}
#sisi nav{padding:.5rem}
#sisi nav button{display:flex;gap:.7rem;align-items:center;width:100%;border:0;background:none;color:inherit;text-align:left;padding:.65rem .75rem;border-radius:8px;cursor:pointer;white-space:nowrap}
#sisi nav button:hover{background:rgba(255,255,255,.08)}
#sisi nav button.aktif{background:var(--emas);color:#0f2c63;font-weight:700}
#sisi nav .ikon{width:20px;text-align:center;flex-shrink:0}
#sisi nav .pemisah{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;opacity:.55;padding:.9rem .75rem .3rem}
body.sisi-kecil #sisi{width:var(--sisi-kecil)}
body.sisi-kecil #sisi .label,body.sisi-kecil #sisi .jenama span.teks,body.sisi-kecil #sisi .pemisah{display:none}
#utama{flex:1;min-width:0;display:flex;flex-direction:column}
#atas{display:flex;align-items:center;gap:.75rem;padding:.6rem 1.25rem;background:var(--kad);border-bottom:1px solid var(--garis);position:sticky;top:0;z-index:20;flex-wrap:wrap}
#atas .ruang{flex:1}
#kandungan{padding:1.25rem;max-width:1500px;width:100%;margin:0 auto}
.tajuk-halaman{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.tajuk-halaman p{margin:.15rem 0 0;color:var(--teks-2)}
/* Komponen */
.kad{background:var(--kad);border:1px solid var(--garis);border-radius:var(--jejari);box-shadow:var(--bayang);padding:1rem}
.kad h2{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.grid{display:grid;gap:1rem}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.kpi{padding:.85rem 1rem}
.kpi .nilai{font-size:1.6rem;font-weight:700;color:var(--hijau)}
.kpi .label{color:var(--teks-2);font-size:.8rem}
.kpi small{display:block;color:var(--teks-2);font-size:.75rem;margin-top:.15rem}
.kpi.amaran .nilai{color:var(--amaran)}.kpi.bahaya .nilai{color:var(--bahaya)}
.btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--garis);background:#fff;padding:.45rem .85rem;border-radius:8px;cursor:pointer;min-height:36px}
.btn:hover{background:var(--hijau-muda)}
.btn.utama{background:var(--hijau);border-color:var(--hijau);color:#fff}.btn.utama:hover{background:var(--hijau-2)}
.btn.bahaya{border-color:var(--bahaya);color:var(--bahaya)}.btn.bahaya:hover{background:var(--bahaya-muda)}
.btn.bahaya.pepejal{background:var(--bahaya);color:#fff}
.btn.kecil{padding:.2rem .55rem;min-height:28px;font-size:.82rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.baris-alat{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.75rem}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{border:1px solid var(--garis);border-radius:8px;padding:.45rem .6rem;background:#fff;min-height:36px;max-width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--hijau);outline-offset:1px}
textarea{width:100%;min-height:70px}
label.medan{display:block;margin-bottom:.7rem}
label.medan>span{display:block;font-size:.8rem;font-weight:600;color:var(--teks-2);margin-bottom:.2rem}
label.medan input,label.medan select{width:100%}
.lencana{display:inline-block;padding:.1rem .5rem;border-radius:99px;font-size:.75rem;font-weight:600;white-space:nowrap}
.lencana.tinggi{background:var(--bahaya-muda);color:var(--bahaya)}
.lencana.rendah{background:var(--info-muda);color:var(--info)}
.lencana.seimbang,.lencana.aktif{background:var(--berjaya-muda);color:var(--berjaya)}
.lencana.amaran{background:var(--amaran-muda);color:var(--amaran)}
.lencana.neutral{background:#e8edf6;color:var(--teks-2)}
/* Jadual */
.bungkus-jadual{overflow:auto;border:1px solid var(--garis);border-radius:8px;background:#fff}
table{border-collapse:collapse;width:100%}
th,td{padding:.5rem .7rem;text-align:left;border-bottom:1px solid var(--garis);vertical-align:top}
th{background:#eef3fb;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;color:var(--teks-2);position:sticky;top:0;white-space:nowrap}
th.boleh{cursor:pointer;user-select:none}th.boleh:hover{background:var(--hijau-muda)}
td.nombor,th.nombor{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:#f6f8fd}
tr.klik{cursor:pointer}
.halaman{display:flex;justify-content:space-between;align-items:center;margin-top:.6rem;gap:.5rem;flex-wrap:wrap;color:var(--teks-2);font-size:.85rem}
.kosong{padding:2rem 1rem;text-align:center;color:var(--teks-2)}
.carta{position:relative;height:320px}.carta.tinggi{height:520px}
/* Modal / toast / loading */
#lapis{position:fixed;inset:0;background:rgba(8,26,63,.5);display:none;align-items:flex-start;justify-content:center;padding:4vh 1rem;overflow:auto;z-index:100}
#lapis.buka{display:flex}
.modal{background:#fff;border-radius:12px;width:min(720px,100%);box-shadow:0 12px 40px rgba(0,0,0,.3)}
.modal.lebar{width:min(980px,100%)}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:.9rem 1.1rem;border-bottom:1px solid var(--garis)}
.modal .isi{padding:1.1rem}
.modal footer{display:flex;gap:.5rem;justify-content:flex-end;padding:.8rem 1.1rem;border-top:1px solid var(--garis);flex-wrap:wrap}
#toast{position:fixed;right:1rem;bottom:1rem;display:flex;flex-direction:column;gap:.5rem;z-index:200;max-width:min(380px,calc(100vw - 2rem))}
.toast{padding:.7rem 1rem;border-radius:8px;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25);animation:masuk .2s}
.toast.berjaya{background:var(--berjaya)}.toast.ralat{background:var(--bahaya)}.toast.info{background:var(--info)}
@keyframes masuk{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#memuat{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--emas),var(--hijau));z-index:300;display:none;animation:lari 1s linear infinite;background-size:200% 100%}
#memuat.buka{display:block}
@keyframes lari{from{background-position:200% 0}to{background-position:0 0}}
.ralat-kotak{background:var(--bahaya-muda);color:var(--bahaya);border-radius:8px;padding:.6rem .8rem;margin:.5rem 0}
.amaran-kotak{background:var(--amaran-muda);color:var(--amaran);border-radius:8px;padding:.6rem .8rem;margin:.5rem 0}
.info-kotak{background:var(--info-muda);color:var(--info);border-radius:8px;padding:.6rem .8rem;margin:.5rem 0}
/* Combobox boleh cari */
.cb{position:relative}.cb input{width:100%}
.cb ul{position:absolute;left:0;right:0;top:100%;z-index:50;background:#fff;border:1px solid var(--garis);border-radius:8px;max-height:240px;overflow:auto;margin:2px 0 0;padding:0;list-style:none;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.cb li{padding:.4rem .7rem;cursor:pointer}.cb li:hover,.cb li.fokus{background:var(--hijau-muda)}.cb li small{color:var(--teks-2)}
/* Log masuk */
#logmasuk{min-height:100vh;display:grid;place-items:center;padding:1rem;background:linear-gradient(135deg,var(--hijau-2),var(--hijau))}
#logmasuk .kad{width:min(400px,100%);padding:1.6rem}
.kepala-log{text-align:center;margin-bottom:1rem}
.logo-log{width:112px;height:112px;object-fit:contain;display:block;margin:0 auto .5rem}
.logo-sisi{width:42px;height:42px;object-fit:contain;flex-shrink:0;background:#fff;border-radius:8px;padding:2px}
.bar-beban{height:8px;border-radius:99px;background:#e1e8f5;overflow:hidden;min-width:70px}.bar-beban>i{display:block;height:100%;background:var(--hijau)}
.diam{color:var(--teks-2)}
.sel-ringkas{display:flex;gap:1rem;flex-wrap:wrap;color:var(--teks-2);font-size:.88rem;margin-bottom:.6rem}
.sel-ringkas b{color:var(--teks)}
.cetak-sahaja{display:none}
@media (max-width:860px){
  #sisi{position:fixed;z-index:60;left:0;top:0;transform:translateX(-100%);transition:transform .2s;width:var(--sisi)}
  body.sisi-buka #sisi{transform:none}
  body.sisi-kecil #sisi{width:var(--sisi)}
  body.sisi-kecil #sisi .label,body.sisi-kecil #sisi .jenama span.teks,body.sisi-kecil #sisi .pemisah{display:inline}
  #kandungan{padding:.75rem}
  .carta{height:260px}
}
/* Surat rasmi (reka bentuk memo: Arial 11pt, margin kiri 3 cm, hitam putih) */
.grid-borang{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:0 1rem}
.grid-borang textarea{width:100%}
.surat{background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;font-size:11pt;line-height:1.3;width:min(210mm,100%);min-height:297mm;margin:0 auto 1rem;padding:22mm 12mm 10mm 30mm;box-shadow:0 1px 6px rgba(0,0,0,.2);box-sizing:border-box;display:flex;flex-direction:column;text-align:left}
.surat p{margin:.6em 0}
.surat-kepala{display:flex;justify-content:space-between;align-items:baseline}
.surat-kepala .kiri-besar{font-size:28pt;font-weight:700;letter-spacing:-1px;line-height:1.1}.surat-kepala .memograf{font-size:11pt}
.surat-meta{width:100%;border-collapse:collapse;table-layout:fixed;line-height:1.5}.surat-meta td{border-top:.5pt solid #000;border-bottom:.5pt solid #000;padding:1px 4px;vertical-align:middle}.surat-meta td.b{font-weight:700}
.surat-meta tr.ruj td{text-align:center;vertical-align:top;line-height:1.15;padding:0 4px;height:10mm}.surat-meta .rl{line-height:1.5}.surat-meta .rn{font-weight:700;min-height:1.15em}.surat-meta tr.ruj td:first-child{border-left:0}.surat-meta .rc+.rc{border-left:.5pt solid #000}
.surat-tajuk{font-weight:700;text-transform:uppercase}
.surat-para{margin:.6em 0;text-align:justify}.surat-para .no{display:inline-block;width:1.27cm}
.surat-butir{margin:.4em 0 .8em 5.08cm;border-collapse:collapse}.surat-butir td{padding:1px 0;vertical-align:top}.surat-butir td:first-child{width:2.2cm}.surat-butir td:nth-child(2){width:.5cm}
.surat-agenda{margin:.2em 0 .8em 1.27cm;text-align:justify}.surat-agenda .ag{display:flex}.surat-agenda .rm{width:1.4cm;flex-shrink:0}
.surat-jadual{width:100%;margin:.8em 0;border-collapse:collapse}.surat-jadual th,.surat-jadual td{border:.5pt solid #000;padding:2px 6px;font-size:10.5pt;text-align:left}
.surat-tutup{break-inside:avoid;margin-top:1.2em}.surat-tutup .ttd{height:54px}
.surat-ahli{margin:1em 0 0 4mm;border-collapse:collapse;line-height:1.5}.surat-ahli td{padding:0 6px 0 0;vertical-align:top}.surat-ahli .aj{width:40%}
/* Laporan JK Induk */
#laporan .tajuk-bahagian{background:var(--hijau);color:#fff;padding:.5rem .8rem;border-radius:8px;margin:1.2rem 0 .6rem;font-size:1rem}
#laporan .blok-jk{margin-bottom:1.1rem}
#laporan .blok-jk h3{margin:.2rem 0 .3rem;color:var(--hijau-2)}
.jadual-laporan{width:100%;border:1px solid var(--garis);background:#fff}
.jadual-laporan td,.jadual-laporan th{padding:.3rem .6rem;font-size:.9rem}
.kepala-cetak{text-align:center;margin-bottom:.8rem}.kepala-cetak h1{font-size:1.1rem}.logo-cetak{width:70px;height:70px;object-fit:contain}
@page surat{size:A4;margin:22mm 12mm 10mm 30mm}
@media print{
  @page{size:A4;margin:12mm}
  #laporan .kumpulan{break-before:page}#laporan .kumpulan:first-of-type{break-before:auto}
  #laporan .blok-jk{break-inside:avoid}
  #laporan .tajuk-bahagian{background:#fff!important;color:#000!important;border:1.5px solid #000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #laporan .jadual-laporan th{background:#e6ecf6!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #laporan .jadual-laporan td,#laporan .jadual-laporan th{font-size:10pt;padding:2px 6px;border:1px solid #888}
  #laporan .blok-jk h3{color:#000;font-size:11pt}
  .surat{page:surat;box-shadow:none;width:auto;min-height:263mm;margin:0;padding:0;break-after:page}.surat:last-child{break-after:auto}
  #sisi,#atas,.tiada-cetak,#toast,#memuat,.btn{display:none!important}
  body{background:#fff}#kandungan{padding:0;max-width:none}
  .kad{box-shadow:none;border-color:#999}
  .cetak-sahaja{display:block}
  .bungkus-jadual{overflow:visible;border:0}th{position:static}
  .carta{height:240px}
}
</style>

function lBenar_(x) { return x === true || x === 'TRUE' || x === 'true' || x === 1; }
function lPeta_(arr, kunci) { var m = {}; (arr || []).forEach(function (o) { m[lId_(o[kunci])] = o; }); return m; }

// Staf yang dikira dalam analisis merit. Ex-officio dan pemegang tempat diasingkan.
function masukAnalisis(s) {
  return !!s && s.status !== 'TIDAK AKTIF' && (s.kategori === 'GURU' || s.kategori === 'SOKONGAN');
}

function meritPosisi(posisiId, tahun, posisiMap, meritMap) {
  var k = tahun + '|' + lId_(posisiId);
  if (Object.prototype.hasOwnProperty.call(meritMap, k)) return Number(meritMap[k]) || 0;
  var p = posisiMap[lId_(posisiId)];
  return p ? (Number(p.merit) || 0) : 0;
}

function binaMeritMap(tetapanMerit) {
  var m = {};
  (tetapanMerit || []).forEach(function (r) { m[Number(r.tahun) + '|' + lId_(r.posisiId)] = Number(r.merit); });
  return m;
}

// Kira merit setiap staf bagi satu tahun. Hanya tugasan AKTIF pada JK yang wujud (dan JK tidak 'TIDAK AKTIF') dikira.
function kiraMerit(d, tahun) {
  var posisiMap = lPeta_(d.posisi, 'posisiId'), jkMap = lPeta_(d.jawatankuasa, 'jkId');
  var meritMap = binaMeritMap(d.tetapanMerit);
  var hasil = {};
  (d.staf || []).forEach(function (s) { hasil[lId_(s.staffId)] = { staffId: lId_(s.staffId), total: 0, bil: 0, butiran: [] }; });
  (d.tugasan || []).forEach(function (t) {
    if (Number(t.tahun) !== Number(tahun) || t.status !== 'AKTIF') return;
    var jk = jkMap[lId_(t.jkId)]; if (!jk || jk.status === 'TIDAK AKTIF') return;
    var h = hasil[lId_(t.staffId)]; if (!h) return;
    var p = posisiMap[lId_(t.posisiId)];
    var m = meritPosisi(t.posisiId, tahun, posisiMap, meritMap);
    h.total += m; h.bil += 1;
    h.butiran.push({ asgId: t.asgId, jkId: t.jkId, jkNama: jk.nama, posisiId: t.posisiId, posisiNama: p ? p.nama : '?', kualifikasi: t.kualifikasi || '', merit: m });
  });
  return hasil;
}

// Peraturan integriti tugasan. t = {asgId?, tahun, jkId, staffId, posisiId, kualifikasi}
// Pulangkan senarai ralat (kosong = sah).
function semakTugasan(t, d) {
  var ralat = [];
  var staf = lPeta_(d.staf, 'staffId')[lId_(t.staffId)];
  var posisi = lPeta_(d.posisi, 'posisiId')[lId_(t.posisiId)];
  var jk = lPeta_(d.jawatankuasa, 'jkId')[lId_(t.jkId)];
  if (!jk) ralat.push('Jawatankuasa tidak wujud.');
  if (!staf) ralat.push('Staf tidak wujud.');
  else if (staf.status === 'TIDAK AKTIF') ralat.push('Staf berstatus TIDAK AKTIF.');
  if (!posisi) ralat.push('Jawatan tidak wujud.');
  else if (!lBenar_(posisi.aktif)) ralat.push('Jawatan tidak aktif.');
  if (!t.tahun) ralat.push('Tahun diperlukan.');
  if (jk && Number(jk.tahun) !== Number(t.tahun)) ralat.push('Tahun tugasan tidak sepadan dengan tahun jawatankuasa.');
  if (ralat.length) return ralat;
  var kual = String(t.kualifikasi || '').trim().toUpperCase();
  var lain = (d.tugasan || []).filter(function (x) {
    return x.status === 'AKTIF' && Number(x.tahun) === Number(t.tahun) && lId_(x.asgId) !== lId_(t.asgId);
  });
  var samaJK = lain.filter(function (x) { return lId_(x.jkId) === lId_(t.jkId); });
  if (samaJK.some(function (x) { return lId_(x.staffId) === lId_(t.staffId) && lId_(x.posisiId) === lId_(t.posisiId) && String(x.kualifikasi || '').trim().toUpperCase() === kual; }))
    ralat.push('Tugasan pendua: staf ini sudah memegang jawatan yang sama dalam jawatankuasa ini.');
  if (!lBenar_(posisi.pelbagaPemegang) &&
    samaJK.some(function (x) { return lId_(x.posisiId) === lId_(t.posisiId) && String(x.kualifikasi || '').trim().toUpperCase() === kual; }))
    ralat.push('Jawatan "' + posisi.nama + '" hanya dibenarkan seorang pemegang dalam satu jawatankuasa.');
  var jawatanSama = lain.filter(function (x) { return lId_(x.staffId) === lId_(t.staffId) && lId_(x.posisiId) === lId_(t.posisiId); });
  if (posisi.bolehBeberapaJK !== '' && posisi.bolehBeberapaJK !== undefined && !lBenar_(posisi.bolehBeberapaJK) && jawatanSama.length)
    ralat.push('Staf ini tidak dibenarkan memegang jawatan "' + posisi.nama + '" dalam lebih daripada satu jawatankuasa.');
  var had = Number(posisi.hadPerStaf);
  if (had > 0 && jawatanSama.length >= had)
    ralat.push('Had jawatan "' + posisi.nama + '" bagi seorang staf (' + had + ') telah dicapai.');
  return ralat;
}

// Pratonton kesan perubahan: jumlah merit sebelum/selepas untuk staf terlibat.
// t = tugasan baharu/disunting; asgIdLama = tugasan yang dibuang/diganti (pilihan).
function pratontonKesan(t, d, ubah) {
  // ubah: {jenis:'tambah'|'sunting'|'padam', asgId?}
  var tahun = Number(t.tahun);
  var sebelum = kiraMerit(d, tahun);
  var salin = { staf: d.staf, posisi: d.posisi, jawatankuasa: d.jawatankuasa, tetapanMerit: d.tetapanMerit, tugasan: (d.tugasan || []).slice() };
  if (ubah.jenis === 'padam' || ubah.jenis === 'sunting')
    salin.tugasan = salin.tugasan.filter(function (x) { return lId_(x.asgId) !== lId_(ubah.asgId); });
  if (ubah.jenis === 'tambah' || ubah.jenis === 'sunting')
    salin.tugasan.push({ asgId: '(baharu)', tahun: tahun, jkId: t.jkId, staffId: t.staffId, posisiId: t.posisiId, kualifikasi: t.kualifikasi || '', status: 'AKTIF' });
  var selepas = kiraMerit(salin, tahun);
  var ids = {};
  if (t.staffId) ids[lId_(t.staffId)] = 1;
  if (ubah.asgId) { var lama = (d.tugasan || []).filter(function (x) { return lId_(x.asgId) === lId_(ubah.asgId); })[0]; if (lama) ids[lId_(lama.staffId)] = 1; }
  var stafMap = lPeta_(d.staf, 'staffId');
  return Object.keys(ids).map(function (id) {
    var a = sebelum[id] ? sebelum[id].total : 0, b = selepas[id] ? selepas[id].total : 0;
    return { staffId: id, nama: stafMap[id] ? stafMap[id].nama : id, sebelum: a, selepas: b, beza: b - a,
      bilSebelum: sebelum[id] ? sebelum[id].bil : 0, bilSelepas: selepas[id] ? selepas[id].bil : 0,
      dianalisis: masukAnalisis(stafMap[id]) };
  });
}

function statistikAsas_(nilai) {
  var n = nilai.length; if (!n) return { n: 0, purata: 0, min: 0, max: 0, median: 0 };
  var s = nilai.slice().sort(function (a, b) { return a - b; });
  var jum = s.reduce(function (a, b) { return a + b; }, 0);
  return { n: n, purata: jum / n, min: s[0], max: s[n - 1], median: n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2 };
}

// Tentukan status beban: ikut sasaran kategori jika ditetapkan, jika tidak ikut % daripada purata.
function statusBeban(total, kategori, purata, tetapan) {
  var min = tetapan['sasaranMin_' + kategori], max = tetapan['sasaranMax_' + kategori];
  var tinggi = (max !== undefined && max !== '' && max !== null) ? Number(max) : purata * (Number(tetapan.ambangTinggi) || 130) / 100;
  var rendah = (min !== undefined && min !== '' && min !== null) ? Number(min) : purata * (Number(tetapan.ambangRendah) || 50) / 100;
  if (total > tinggi) return 'TINGGI';
  if (total < rendah) return 'RENDAH';
  return 'SEIMBANG';
}

function jkLengkap_(jk, tugasanJK, stafMap, posisiMap, tetapan) {
  var wajib = String(jk.posisiWajib || tetapan.posisiWajib || '').split(',').map(function (x) { return x.trim().toUpperCase(); }).filter(Boolean);
  var ada = {};
  var pemegang = false;
  tugasanJK.forEach(function (t) {
    var p = posisiMap[lId_(t.posisiId)]; if (p) ada[String(p.nama).toUpperCase()] = true;
    var s = stafMap[lId_(t.staffId)]; if (s && s.kategori === 'PEMEGANG') pemegang = true;
  });
  var kurang = wajib.filter(function (w) { return !w.split('|').some(function (a) { return ada[a.trim()]; }); });
  return { lengkap: !kurang.length && !pemegang, kurang: kurang, pemegangTempat: pemegang };
}

// Ringkasan dashboard untuk satu tahun (turas ikut penapis pilihan).
function ringkasDashboard(d, tahun, tetapan, tapis) {
  tapis = tapis || {};
  var merit = kiraMerit(d, tahun);
  var posisiMap = lPeta_(d.posisi, 'posisiId'), stafMap = lPeta_(d.staf, 'staffId');
  var jkTahun = (d.jawatankuasa || []).filter(function (j) { return Number(j.tahun) === Number(tahun) && j.status !== 'TIDAK AKTIF'; });
  if (tapis.kategoriJK) jkTahun = jkTahun.filter(function (j) { return j.kategori === tapis.kategoriJK; });
  var jkIds = lPeta_(jkTahun, 'jkId');
  var aktif = (d.tugasan || []).filter(function (t) { return Number(t.tahun) === Number(tahun) && t.status === 'AKTIF' && jkIds[lId_(t.jkId)]; });
  if (tapis.posisiId) aktif = aktif.filter(function (t) { return lId_(t.posisiId) === lId_(tapis.posisiId); });
  var meritMap = binaMeritMap(d.tetapanMerit);

  var stafAnalisis = (d.staf || []).filter(masukAnalisis);
  if (tapis.jabatan) stafAnalisis = stafAnalisis.filter(function (s) { return s.jabatan === tapis.jabatan; });
  if (tapis.kategoriStaf) stafAnalisis = stafAnalisis.filter(function (s) { return s.kategori === tapis.kategoriStaf; });
  if (tapis.staffId) stafAnalisis = stafAnalisis.filter(function (s) { return lId_(s.staffId) === lId_(tapis.staffId); });
  var penapisanTugasan = tapis.kategoriJK || tapis.posisiId;
  // Jika penapis JK/jawatan digunakan, jumlah dikira semula daripada tugasan yang ditapis sahaja.
  var jumlahStaf = {};
  aktif.forEach(function (t) {
    var k = lId_(t.staffId);
    jumlahStaf[k] = jumlahStaf[k] || { total: 0, bil: 0 };
    jumlahStaf[k].total += meritPosisi(t.posisiId, tahun, posisiMap, meritMap); jumlahStaf[k].bil++;
  });
  var rujuk = function (id) { return penapisanTugasan ? (jumlahStaf[id] || { total: 0, bil: 0 }) : (merit[id] || { total: 0, bil: 0 }); };

  var senarai = stafAnalisis.map(function (s) {
    var m = rujuk(lId_(s.staffId));
    return { staffId: lId_(s.staffId), nama: s.nama, jabatan: s.jabatan, kategori: s.kategori, total: m.total, bil: m.bil, status: '' };
  });
  var st = statistikAsas_(senarai.map(function (x) { return x.total; }));
  var puratKat = {}; senarai.forEach(function (x) { var o = puratKat[x.kategori] = puratKat[x.kategori] || { j: 0, n: 0 }; o.j += x.total; o.n++; });
  senarai.forEach(function (x) { var o = puratKat[x.kategori]; x.status = statusBeban(x.total, x.kategori, o.n ? o.j / o.n : 0, tetapan); });
  senarai.sort(function (a, b) { return b.total - a.total || a.nama.localeCompare(b.nama); });
  senarai.forEach(function (x, i) { x.kedudukan = i + 1; });

  // Taburan jawatan
  var tabJ = {};
  aktif.forEach(function (t) {
    var p = posisiMap[lId_(t.posisiId)]; if (!p) return;
    var o = tabJ[p.nama] = tabJ[p.nama] || { nama: p.nama, bil: 0, merit: meritPosisi(t.posisiId, tahun, posisiMap, meritMap) };
    o.bil++;
  });
  var taburanJawatan = Object.keys(tabJ).map(function (k) { return tabJ[k]; }).sort(function (a, b) { return b.bil - a.bil; });

  // Komposisi JK + liputan
  var perJK = {}; aktif.forEach(function (t) { (perJK[lId_(t.jkId)] = perJK[lId_(t.jkId)] || []).push(t); });
  var komposisi = jkTahun.map(function (j) {
    var ts = perJK[lId_(j.jkId)] || [];
    var lg = jkLengkap_(j, ts, stafMap, posisiMap, tetapan);
    return { jkId: j.jkId, kod: j.kod, nama: j.nama, kategori: j.kategori, bil: ts.length,
      merit: ts.reduce(function (a, t) { return a + meritPosisi(t.posisiId, tahun, posisiMap, meritMap); }, 0), lengkap: lg.lengkap, kurang: lg.kurang, pemegangTempat: lg.pemegangTempat };
  });

  // Perbandingan mengikut jabatan/kategori staf
  var kump = {};
  senarai.forEach(function (x) { var k = x.jabatan || '(Tiada jabatan)'; var o = kump[k] = kump[k] || { nama: k, bil: 0, jumlah: 0 }; o.bil++; o.jumlah += x.total; });
  var jabatan = Object.keys(kump).map(function (k) { var o = kump[k]; return { nama: o.nama, bil: o.bil, jumlah: o.jumlah, purata: o.bil ? o.jumlah / o.bil : 0 }; });

  // Histogram (lebar 10 mata)
  var lebar = 10, hist = {};
  senarai.forEach(function (x) { var b = Math.floor(x.total / lebar) * lebar; hist[b] = (hist[b] || 0) + 1; });
  var histogram = Object.keys(hist).map(Number).sort(function (a, b) { return a - b; }).map(function (b) { return { label: b + '–' + (b + lebar - 1), bil: hist[b] }; });

  var jumlahMerit = senarai.reduce(function (a, x) { return a + x.total; }, 0);
  var tertinggi = senarai[0] || null, terendah = senarai.length ? senarai[senarai.length - 1] : null;
  return {
    tahun: Number(tahun),
    kad: {
      bilJK: jkTahun.length, bilStaf: senarai.length, bilTugasan: aktif.length, jumlahMerit: jumlahMerit,
      purata: st.purata, median: st.median,
      tertinggi: tertinggi ? { nama: tertinggi.nama, total: tertinggi.total } : null,
      terendah: terendah ? { nama: terendah.nama, total: terendah.total } : null,
      tiadaTugasan: senarai.filter(function (x) { return x.bil === 0; }).length,
      bebanTinggi: senarai.filter(function (x) { return x.status === 'TINGGI'; }).length,
      bebanRendah: senarai.filter(function (x) { return x.status === 'RENDAH'; }).length,
      jkTidakLengkap: komposisi.filter(function (k) { return !k.lengkap; }).length,
      diasingkan: (d.staf || []).filter(function (s) { return s.status !== 'TIDAK AKTIF' && !masukAnalisis(s); }).length
    },
    ranking: senarai, taburanJawatan: taburanJawatan, komposisi: komposisi, jabatan: jabatan, histogram: histogram
  };
}

// Banding dua tahun mengikut staf (analisis sahaja).
function bandingTahun(d, tahunA, tahunB) {
  var a = kiraMerit(d, tahunA), b = kiraMerit(d, tahunB);
  var baris = (d.staf || []).filter(masukAnalisis).map(function (s) {
    var id = lId_(s.staffId), x = a[id] || { total: 0, bil: 0 }, y = b[id] || { total: 0, bil: 0 };
    return { staffId: id, nama: s.nama, meritA: x.total, bilA: x.bil, meritB: y.total, bilB: y.bil, beza: y.total - x.total };
  });
  baris.sort(function (p, q) { return Math.abs(q.beza) - Math.abs(p.beza); });
  var jum = function (k) { return baris.reduce(function (s, r) { return s + r[k]; }, 0); };
  return { tahunA: tahunA, tahunB: tahunB, jumlahA: jum('meritA'), jumlahB: jum('meritB'), baris: baris };
}

// Cadangan (bukan pelantikan): calon dengan merit terendah yang belum berada dalam JK ini.
function cadangCalon(d, tahun, jkId, tetapan, bil) {
  var merit = kiraMerit(d, tahun);
  var dalam = {};
  (d.tugasan || []).forEach(function (t) { if (Number(t.tahun) === Number(tahun) && t.status === 'AKTIF' && lId_(t.jkId) === lId_(jkId)) dalam[lId_(t.staffId)] = 1; });
  var calon = (d.staf || []).filter(function (s) { return masukAnalisis(s) && !dalam[lId_(s.staffId)]; })
    .map(function (s) { var m = merit[lId_(s.staffId)]; return { staffId: lId_(s.staffId), nama: s.nama, kategori: s.kategori, jabatan: s.jabatan, total: m.total, bil: m.bil }; });
  var pk = {}; (d.staf || []).filter(masukAnalisis).forEach(function (s) { var o = pk[s.kategori] = pk[s.kategori] || { j: 0, n: 0 }; o.j += merit[lId_(s.staffId)].total; o.n++; });
  calon.forEach(function (c) { var o = pk[c.kategori]; c.status = statusBeban(c.total, c.kategori, o && o.n ? o.j / o.n : 0, tetapan); });
  calon.sort(function (a, b) { return a.total - b.total || a.bil - b.bil; });
  return calon.slice(0, bil || 10);
}

// Semak baris import staf (peringkat 'staging'): pulangkan baris dengan ralat/amaran, tanpa menulis apa-apa.
function semakImportStaf(baris, stafSedia) {
  var idSedia = lPeta_(stafSedia, 'staffId'), emelSedia = {}, namaSedia = {};
  stafSedia.forEach(function (s) { if (s.emel) emelSedia[String(s.emel).toLowerCase()] = s; namaSedia[normNama_(s.nama)] = s; });
  var dalamFail = {};
  return baris.map(function (b, i) {
    var ralat = [], amaran = [];
    var id = lId_(b.staffId).trim(), nama = lId_(b.nama).trim();
    if (!id) ralat.push('ID staf kosong'); if (!nama) ralat.push('Nama kosong');
    if (id && idSedia[id]) ralat.push('ID sudah wujud (tidak akan ditimpa)');
    if (id && dalamFail[id]) ralat.push('ID berulang dalam fail');
    if (id) dalamFail[id] = 1;
    if (nama && namaSedia[normNama_(nama)] && !idSedia[id]) amaran.push('Nama menyerupai staf sedia ada: ' + namaSedia[normNama_(nama)].staffId);
    if (b.emel && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(b.emel)) ralat.push('Format emel tidak sah');
    if (b.emel && emelSedia[String(b.emel).toLowerCase()]) amaran.push('Emel telah digunakan oleh ' + emelSedia[String(b.emel).toLowerCase()].staffId);
    if (b.kategori && ['GURU', 'SOKONGAN', 'EXOFFICIO', 'PEMEGANG'].indexOf(b.kategori) < 0) ralat.push('Kategori mesti GURU/SOKONGAN/EXOFFICIO/PEMEGANG');
    return { baris: i + 2, data: b, ralat: ralat, amaran: amaran, sah: !ralat.length };
  });
}
// Semak import jawatankuasa & pelantikan. Baris tanpa staf/jawatan hanya mencipta jawatankuasa.
// baris: [{kod, nama, kategori, staffId, namaStaf, jawatan, kualifikasi}]
// Pulangkan {hasil, jkBaru, tugasanBaru}; id jkBaru sementara ('__JK1') dipetakan semasa penulisan.
function semakImportPelantikan(baris, d, tahun) {
  var stafId = lPeta_(d.staf, 'staffId'), stafNama = {}, posisiNama = {}, jkNama = {};
  (d.staf || []).forEach(function (s) { var k = normNama_(s.nama); stafNama[k] = stafNama[k] ? 'BERULANG' : s; });
  (d.posisi || []).forEach(function (p) { posisiNama[String(p.nama).trim().toUpperCase()] = p; });
  if (posisiNama['AHLI JAWATANKUASA'] && !posisiNama.AHLI) posisiNama.AHLI = posisiNama['AHLI JAWATANKUASA'];
  (d.jawatankuasa || []).forEach(function (j) { if (Number(j.tahun) === Number(tahun)) jkNama[String(j.nama).trim().toUpperCase()] = j; });
  var kerja = { staf: d.staf, posisi: d.posisi, jawatankuasa: (d.jawatankuasa || []).slice(), tugasan: (d.tugasan || []).slice() };
  var noJ = 0, calonJK = [], digunakan = {}, tugasanBaru = [];
  var hasil = baris.map(function (b, i) {
    var ralat = [], namaJK = lId_(b.nama).trim(), kunci = namaJK.toUpperCase(), jk = jkNama[kunci];
    var adaOrang = lId_(b.staffId).trim() || lId_(b.namaStaf).trim() || lId_(b.jawatan).trim();
    if (!namaJK) ralat.push('Nama jawatankuasa kosong');
    if (namaJK && !jk) {
      jk = { jkId: '__JK' + (++noJ), tahun: Number(tahun), kod: lId_(b.kod).trim(), nama: namaJK, kategori: lId_(b.kategori).trim(), status: 'AKTIF' };
      jkNama[kunci] = jk; calonJK.push(jk); kerja.jawatankuasa.push(jk);
    }
    var staf = null, posisi = null;
    if (namaJK && adaOrang) {
      var id = lId_(b.staffId).trim(), nama = lId_(b.namaStaf).trim();
      staf = id && stafId[id] ? stafId[id] : (nama ? stafNama[normNama_(nama)] : null);
      if (staf === 'BERULANG') { ralat.push('Nama staf "' + nama + '" berulang; gunakan ID staf'); staf = null; }
      else if (!staf) ralat.push('Staf tidak dijumpai: ' + (id || nama || '(kosong)') + ' — import staf dahulu');
      posisi = posisiNama[lId_(b.jawatan).trim().toUpperCase()];
      if (!posisi) ralat.push('Jawatan tidak dijumpai: "' + lId_(b.jawatan).trim() + '" — tambah di Jawatan & Merit');
      if (staf && posisi) {

var MENU = [
  { id: 'papan', ikon: '📊', label: 'Papan Pemuka', min: 'PELIHAT' }, { id: 'jk', ikon: '🗂', label: 'Jawatankuasa', min: 'PELIHAT' },
  { id: 'laporan', ikon: '🖨', label: 'Laporan JK Induk', min: 'PELIHAT' }, { id: 'staf', ikon: '👥', label: 'Staf & Guru', min: 'PELIHAT' }, { id: 'analisis', ikon: '⚖', label: 'Analisis Beban', min: 'PELIHAT' },
  { sep: 'Surat Rasmi' }, { id: 'suratLantik', ikon: '✉', label: 'Surat Perlantikan', min: 'PENGURUS' }, { id: 'suratMesyuarat', ikon: '📨', label: 'Surat Panggilan Mesyuarat', min: 'PENGURUS' },
  { sep: 'Konfigurasi' }, { id: 'posisi', ikon: '🏷', label: 'Jawatan & Merit', min: 'PELIHAT' }, { id: 'import', ikon: '⇅', label: 'Import / Eksport', min: 'PELIHAT' },
  { sep: 'Pentadbiran' }, { id: 'pengguna', ikon: '🔑', label: 'Pengguna', min: 'PENTADBIR' }, { id: 'tetapan', ikon: '⚙', label: 'Tetapan', min: 'PENTADBIR' }, { id: 'audit', ikon: '📜', label: 'Log Audit', min: 'PENTADBIR' }
];
var PAPARAN = {
  papan: [function () { return paparPapan(); }, 'Papan Pemuka'], jk: [function (p) { return p ? paparJKButiran(p) : paparJK(); }, 'Jawatankuasa'], staf: [function () { return paparStaf(); }, 'Staf & Guru'],
  laporan: [function () { return paparLaporan(); }, 'Laporan JK Induk'],
  suratLantik: [function () { return paparSuratLantik(); }, 'Surat Perlantikan'], suratMesyuarat: [function () { return paparSuratMesyuarat(); }, 'Surat Panggilan Mesyuarat'],
  profil: [function (p) { return paparProfil(p); }, 'Profil Merit Staf'], analisis: [function () { return paparAnalisis(); }, 'Analisis Beban'], posisi: [function () { return paparPosisi(); }, 'Jawatan & Merit'],
  import: [function () { return paparImport(); }, 'Import / Eksport'], pengguna: [function () { return paparPengguna(); }, 'Pengguna'], tetapan: [function () { return paparTetapan(); }, 'Tetapan'], audit: [function () { return paparAudit(); }, 'Log Audit']
};
function lukisMenu() {
  var nav = kosongkan($('#menu')), sepAktif = null;
  MENU.forEach(function (m) {
    if (m.sep) { sepAktif = h('div', { class: 'pemisah' }, m.sep); return; }
    if (!boleh(m.min)) return;
    if (sepAktif) { nav.appendChild(sepAktif); sepAktif = null; }
    var asal = S.paparan === 'profil' ? 'staf' : S.paparan;
    nav.appendChild(h('button', { class: m.id === asal ? 'aktif' : '', 'aria-current': m.id === asal ? 'page' : null, onclick: function () { pergi(m.id); document.body.classList.remove('sisi-buka'); } }, h('span', { class: 'ikon' }, m.ikon), h('span', { class: 'label' }, m.label)));
  });
}
function pergi(paparan, param) { S.paparan = paparan; S.param = param || null; render(); window.scrollTo(0, 0); }
var jenisRender = 0;
async function render() {
  var no = ++jenisRender, k = $('#kandungan'); lupusCarta(); lukisMenu();
  $('#tajukAtas').textContent = (PAPARAN[S.paparan] || ['', ''])[1];
  try {
    var node = await PAPARAN[S.paparan][0](S.param);
    if (no !== jenisRender) return;            // pengguna sudah berpindah halaman
    kosongkan(k).appendChild(node);
    // Carta yang dibina dalam setTimeout kadCarta tetap berjalan selepas node dilampirkan
  } catch (e) {
    if (no !== jenisRender) return;
    if (!e || !e.dikendali) { console.error(e); toast('Ralat memuatkan halaman.', 'ralat'); }
    kosongkan(k).appendChild(h('div', { class: 'kad kosong' }, 'Halaman tidak dapat dimuatkan. ', h('button', { class: 'btn', onclick: render }, 'Cuba lagi')));
  }
}

/* ===== Data asas ===== */
async function muatAsas() {
  S.asas = await panggil('muatAsas'); terapJenama(S.asas.tetapan);
  if (!S.tahun || S.asas.tahun.indexOf(S.tahun) < 0) S.tahun = S.asas.tahun.indexOf(S.asas.tahunAktif) >= 0 ? S.asas.tahunAktif : S.asas.tahun[S.asas.tahun.length - 1];
  var sel = kosongkan($('#pilihTahun'));
  S.asas.tahun.forEach(function (t) { sel.appendChild(h('option', { value: t, selected: t === S.tahun }, t)); });
}

/* ===== Log masuk / keluar ===== */
function keLogMasuk(mesej) {
  S.token = null; simpanToken(null); S.pengguna = null; lupusCarta();
  $('#apl').classList.add('tersembunyi'); $('#logmasuk').classList.remove('tersembunyi');
  var r = $('#logRalat'); if (mesej) { r.textContent = mesej; r.classList.remove('tersembunyi'); } else r.classList.add('tersembunyi');
}
async function masukApl(data) {
  S.token = data.token; simpanToken(S.token); S.pengguna = data.pengguna;
  $('#logmasuk').classList.add('tersembunyi'); $('#apl').classList.remove('tersembunyi');
  $('#infoPengguna').textContent = S.pengguna.nama + ' (' + { PENTADBIR: 'System Admin', PENGURUS: 'Editor', PELIHAT: 'Viewer' }[S.pengguna.peranan] + ')';
  await muatAsas(); S.paparan = 'papan'; S.param = null; render();
}
function dialogTukarKata() {
  var l = h('input', { type: 'password', autocomplete: 'current-password' }), b = h('input', { type: 'password', autocomplete: 'new-password' }), b2 = h('input', { type: 'password', autocomplete: 'new-password' });
  modal({ tajuk: 'Tukar Kata Laluan', isi: h('div', null, medan('Kata laluan semasa', l), medan('Kata laluan baharu (min. 8 aksara)', b), medan('Ulang kata laluan baharu', b2)),
    butang: [{ label: 'Batal' }, { label: 'Simpan', kelas: 'utama', onClick: ujiTindakan(async function () {
      if (b.value !== b2.value) { toast('Kata laluan baharu tidak sepadan.', 'ralat'); return false; }
      toast((await panggil('tukarKata', { lama: l.value, baru: b.value }, { penuh: true })).message, 'berjaya'); }) }] });
}

/* ===== Permulaan ===== */
document.addEventListener('DOMContentLoaded', function () {
  $('#btnSisi').addEventListener('click', function () { if (window.innerWidth <= 860) document.body.classList.toggle('sisi-buka'); else document.body.classList.toggle('sisi-kecil'); });
  $('#pilihTahun').addEventListener('change', function (e) { S.tahun = Number(e.target.value); render(); });
  $('#btnKeluar').addEventListener('click', ujiTindakan(async function () { try { await panggil('logout', {}, { senyap: true }); } catch (e) {} keLogMasuk(); }));
  $('#btnTukarKata').addEventListener('click', dialogTukarKata);
  $('#borangLog').addEventListener('submit', function (e) {
    e.preventDefault(); var r = $('#logRalat'); r.classList.add('tersembunyi');
    panggil('login', { emel: $('#logEmel').value, kataLaluan: $('#logKata').value }, { senyap: true })
      .then(function (d) { $('#logKata').value = ''; return masukApl(d); })
      .catch(function (err) { r.textContent = err && err.message || 'Log masuk gagal.'; r.classList.remove('tersembunyi'); });
  });
  // Cuba sesi sedia ada atau akaun Google yang dikenali pelayan
  S.token = bacaToken();
  var muatJenama = panggil('jenama', {}, { senyap: true }).then(terapJenama).catch(function () {});
  var muatSesi = panggil('sesi', {}, { senyap: true }).then(function (d) { return d; }, function () { return null; });
  Promise.all([muatSesi, muatJenama]).then(function (r) { if (r[0]) return masukApl(r[0]); keLogMasuk(); }).catch(function () { keLogMasuk(); });
});
</script>

</body>
</html>
